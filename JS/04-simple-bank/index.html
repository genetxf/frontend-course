<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Bank</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="bank-card">
      <div>
        <p class="label">Current Balance</p>
        <h1 id="balance">$1000</h1>
      </div>
      <div class="bank-mark">$</div>
    </section>

    <section class="summary">
      <div>
        <p class="summary-label">Total Deposit</p>
        <p id="totalDeposit" class="summary-amount">$0</p>
      </div>
      <div>
        <p class="summary-label">Total Withdraw</p>
        <p id="totalWithdraw" class="summary-amount">$0</p>
      </div>
    </section>

    <section class="panel">
      <h2>Simple Bank</h2>

      <label for="amountInput">Amount</label>
      <input id="amountInput" type="number" min="1" placeholder="Enter amount">

      <div class="actions">
        <button id="depositButton" class="deposit">Deposit</button>
        <button id="withdrawButton" class="withdraw">Withdraw</button>
      </div>

      <button id="resetButton" class="reset">Reset Account</button>

      <p id="message" class="message">Welcome to your account.</p>
    </section>
  </main>
</body>
</html>
