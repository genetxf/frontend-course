<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Checker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Age Checker</h1>

    <label for="ageInput">Enter your age</label>
    <input id="ageInput" type="number" min="0" placeholder="Example: 18">

    <button id="checkButton">Check Age</button>

    <p id="result" class="result">Your result will show here.</p>
  </main>
</body>
</html>
