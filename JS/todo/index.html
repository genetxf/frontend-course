<body class="min-h-screen bg-slate-100 px-4 py-8 text-slate-900">
    <main class="mx-auto w-full max-w-xl">
        <section class="rounded-lg bg-white p-6 shadow-sm ring-1 ring-slate-200">
            <div class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <p class="text-sm font-medium uppercase text-teal-700">Daily planner</p>
                    <h1 class="text-3xl font-semibold">Todo Application</h1>
                </div>
                <p id="task-count" class="text-sm font-medium text-slate-500">0 tasks</p>
            </div>

            <form id="todo-form" class="flex flex-col gap-3 sm:flex-row">
                <label class="sr-only" for="todo-input">Task name</label>
                <input
                    class="min-h-12 flex-1 rounded-md border border-slate-300 bg-white px-4 text-base outline-none transition focus:border-teal-600 focus:ring-4 focus:ring-teal-100"
                    type="text"
                    placeholder="Enter a task"
                    id="todo-input"
                    autocomplete="off"
                    required
                >
                <button
                    class="min-h-12 rounded-md bg-teal-700 px-6 font-semibold text-white transition hover:bg-teal-800 focus:outline-none focus:ring-4 focus:ring-teal-200"
                    type="submit"
                >
                    Add
                </button>
            </form>

            <p id="empty-message" class="mt-6 rounded-md border border-dashed border-slate-300 p-4 text-center text-sm text-slate-500">
                No tasks yet. Add one above.
            </p>

            <ul id="todo-list" class="mt-6 flex flex-col gap-3" aria-live="polite"></ul>
        </section>
    </main>
